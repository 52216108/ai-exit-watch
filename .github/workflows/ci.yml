name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Swift core
        run: swift test
      - name: Build universal app
        run: bash scripts/build-app.sh --universal
      - name: Package macOS
        run: python3 scripts/package-release.py macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-universal
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test Windows core and named pipe
        run: dotnet run --project windows/WatchCore.Tests -c Release -- .build/windows-tests
      - name: Test exported protection script
        run: node windows/WatchCore.Tests/verify-lock.mjs .build/windows-tests
      - name: Build portable app
        run: ./windows/build.ps1
      - name: Check process starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/windows-x64/AIExitWatch.exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $app.Refresh()
            if ($app.HasExited) { throw "应用提前退出，退出码：$($app.ExitCode)" }
            Write-Host '应用进程已持续运行 12 秒；不等于桌面交互验收。'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Package Windows
        run: python scripts/package-release.py windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-x64
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
